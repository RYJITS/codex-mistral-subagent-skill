name: Rapport de bug
description: Signaler un probleme pour nous aider a ameliorer le skill
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Merci de decrire le probleme avec un maximum de contexte utile. Les champs ci-dessous nous aident a reproduire et corriger le bug plus vite.

  - type: input
    id: version
    attributes:
      label: Version du skill
      description: Quelle version du skill utilisez-vous ?
      placeholder: ex. 1.0.0
    validations:
      required: true

  - type: textarea
    id: contexte-utilisation
    attributes:
      label: Contexte d'usage
      description: Dans quel flux de travail ou quelle tache utilisez-vous ce skill ?
      placeholder: ex. Delegation d'une tache repo, extraction JSON, critique UI/UX
    validations:
      required: true

  - type: textarea
    id: commandes-executees
    attributes:
      label: Commandes executees
      description: Quelles commandes ou instructions ont ete lancees juste avant le bug ?
      placeholder: |
        1. npm run validate
        2. npm run check:helper
        3. node mistral-subagent/scripts/mistral-subagent.mjs run ...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Decrivez clairement le probleme observe.
    validations:
      required: true

  - type: textarea
    id: etapes-reproduction
    attributes:
      label: Etapes pour reproduire
      description: Donnez les etapes minimales pour reproduire le bug.
      placeholder: |
        1. Executer ...
        2. Fournir ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: comportement-attendu
    attributes:
      label: Comportement attendu
      description: Quel resultat attendiez-vous ?
    validations:
      required: true

  - type: textarea
    id: comportement-obtenu
    attributes:
      label: Comportement obtenu
      description: Que s'est-il passe a la place ?
    validations:
      required: true

  - type: textarea
    id: logs-ou-captures
    attributes:
      label: Logs ou captures
      description: Ajoutez ici les logs, messages d'erreur, ou captures utiles.

  - type: textarea
    id: contexte-supplementaire
    attributes:
      label: Contexte supplementaire
      description: Precisez l'environnement, la configuration, ou tout autre detail utile.
