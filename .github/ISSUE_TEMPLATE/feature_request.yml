name: Demande de fonctionnalite
description: Proposer une amelioration utile pour le skill
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Merci de decrire clairement le besoin. Les questions ci-dessous nous aident a evaluer l'impact reel de la proposition sur le skill et les workflows Codex.

  - type: input
    id: resume
    attributes:
      label: Resume
      description: Donnez un titre court pour l'amelioration proposee.
    validations:
      required: true

  - type: textarea
    id: probleme-ou-besoin
    attributes:
      label: Probleme ou besoin
      description: Quel probleme actuel ou quel besoin concret cette amelioration couvrirait-elle ?
      placeholder: ex. Le workflow actuel demande une verification manuelle trop frequente
    validations:
      required: true

  - type: textarea
    id: contexte-utilisation
    attributes:
      label: Contexte d'usage
      description: Dans quel type de tache ou de projet cette amelioration serait-elle utile ?
      placeholder: ex. Delegation de revue de diff, generation de docs, extraction structuree
    validations:
      required: true

  - type: textarea
    id: solution-proposee
    attributes:
      label: Solution proposee
      description: Decrivez le comportement ou le changement attendu.
    validations:
      required: true

  - type: textarea
    id: impact-attendu
    attributes:
      label: Impact attendu
      description: Quel gain ou quelle reduction de friction attendez-vous ?
      placeholder: ex. Moins de reprises manuelles, meilleure fiabilite, meilleur cadrage
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagees
      description: Avez-vous envisage d'autres approches ? Si oui, lesquelles ?

  - type: textarea
    id: contexte-supplementaire
    attributes:
      label: Contexte supplementaire
      description: Ajoutez ici tout exemple, contrainte technique, ou detail utile.
